<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Glow filter for servers -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Stronger glow for pulses -->
    <filter id="pulseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Background radial gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </radialGradient>
    <!-- Circle border gradient -->
    <radialGradient id="circleGrad" cx="50%" cy="50%" r="50%">
      <stop offset="85%" stop-color="transparent"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0.15"/>
    </radialGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="250" cy="235" r="210" fill="url(#bgGrad)" stroke="#00d4ff" stroke-width="1.5" stroke-opacity="0.3"/>
  <circle cx="250" cy="235" r="210" fill="url(#circleGrad)"/>

  <!-- Orbit ring -->
  <circle cx="250" cy="235" r="150" fill="none" stroke="#00d4ff" stroke-width="0.5" stroke-opacity="0.15" stroke-dasharray="4 6"/>

  <!-- Connection lines from center to each server (8 servers) -->
  <!-- Top -->
  <line x1="250" y1="235" x2="250" y2="90" stroke="#00d4ff" stroke-width="0.8" stroke-opacity="0.2"/>
  <!-- Top-Right -->
  <line x1="250" y1="235" x2="356" y2="132" stroke="#00d4ff" stroke-width="0.8" stroke-opacity="0.2"/>
  <!-- Right -->
  <line x1="250" y1="235" x2="395" y2="235" stroke="#00d4ff" stroke-width="0.8" stroke-opacity="0.2"/>
  <!-- Bottom-Right -->
  <line x1="250" y1="235" x2="356" y2="338" stroke="#00d4ff" stroke-width="0.8" stroke-opacity="0.2"/>
  <!-- Bottom -->
  <line x1="250" y1="235" x2="250" y2="380" stroke="#00d4ff" stroke-width="0.8" stroke-opacity="0.2"/>
  <!-- Bottom-Left -->
  <line x1="250" y1="235" x2="144" y2="338" stroke="#00d4ff" stroke-width="0.8" stroke-opacity="0.2"/>
  <!-- Left -->
  <line x1="250" y1="235" x2="105" y2="235" stroke="#00d4ff" stroke-width="0.8" stroke-opacity="0.2"/>
  <!-- Top-Left -->
  <line x1="250" y1="235" x2="144" y2="132" stroke="#00d4ff" stroke-width="0.8" stroke-opacity="0.2"/>

  <!-- === PULSE ANIMATIONS (outward: cyan, return: orange) === -->

  <!-- Pulse: Center to Top -->
  <circle r="4" fill="#00d4ff" filter="url(#pulseGlow)" opacity="0">
    <animateMotion path="M250,235 L250,90" dur="1.8s" repeatCount="indefinite" begin="0s"/>
    <animate attributeName="opacity" values="0;0.9;0.9;0" dur="1.8s" repeatCount="indefinite" begin="0s"/>
  </circle>
  <circle r="3" fill="#ff6b35" filter="url(#pulseGlow)" opacity="0">
    <animateMotion path="M250,90 L250,235" dur="1.8s" repeatCount="indefinite" begin="0.9s"/>
    <animate attributeName="opacity" values="0;0.8;0.8;0" dur="1.8s" repeatCount="indefinite" begin="0.9s"/>
  </circle>

  <!-- Pulse: Center to Top-Right -->
  <circle r="4" fill="#00d4ff" filter="url(#pulseGlow)" opacity="0">
    <animateMotion path="M250,235 L356,132" dur="1.8s" repeatCount="indefinite" begin="0.2s"/>
    <animate attributeName="opacity" values="0;0.9;0.9;0" dur="1.8s" repeatCount="indefinite" begin="0.2s"/>
  </circle>
  <circle r="3" fill="#ff6b35" filter="url(#pulseGlow)" opacity="0">
    <animateMotion path="M356,132 L250,235" dur="1.8s" repeatCount="indefinite" begin="1.1s"/>
    <animate attributeName="opacity" values="0;0.8;0.8;0" dur="1.8s" repeatCount="indefinite" begin="1.1s"/>
  </circle>

  <!-- Pulse: Center to Right -->
  <circle r="4" fill="#00d4ff" filter="url(#pulseGlow)" opacity="0">
    <animateMotion path="M250,235 L395,235" dur="1.8s" repeatCount="indefinite" begin="0.4s"/>
    <animate attributeName="opacity" values="0;0.9;0.9;0" dur="1.8s" repeatCount="indefinite" begin="0.4s"/>
  </circle>
  <circle r="3" fill="#ff6b35" filter="url(#pulseGlow)" opacity="0">
    <animateMotion path="M395,235 L250,235" dur="1.8s" repeatCount="indefinite" begin="1.3s"/>
    <animate attributeName="opacity" values="0;0.8;0.8;0" dur="1.8s" repeatCount="indefinite" begin="1.3s"/>
  </circle>

  <!-- Pulse: Center to Bottom-Right -->
  <circle r="4" fill="#00d4ff" filter="url(#pulseGlow)" opacity="0">
    <animateMotion path="M250,235 L356,338" dur="1.8s" repeatCount="indefinite" begin="0.6s"/>
    <animate attributeName="opacity" values="0;0.9;0.9;0" dur="1.8s" repeatCount="indefinite" begin="0.6s"/>
  </circle>
  <circle r="3" fill="#ff6b35" filter="url(#pulseGlow)" opacity="0">
    <animateMotion path="M356,338 L250,235" dur="1.8s" repeatCount="indefinite" begin="1.5s"/>
    <animate attributeName="opacity" values="0;0.8;0.8;0" dur="1.8s" repeatCount="indefinite" begin="1.5s"/>
  </circle>

  <!-- Pulse: Center to Bottom -->
  <circle r="4" fill="#00d4ff" filter="url(#pulseGlow)" opacity="0">
    <animateMotion path="M250,235 L250,380" dur="1.8s" repeatCount="indefinite" begin="0.8s"/>
    <animate attributeName="opacity" values="0;0.9;0.9;0" dur="1.8s" repeatCount="indefinite" begin="0.8s"/>
  </circle>
  <circle r="3" fill="#ff6b35" filter="url(#pulseGlow)" opacity="0">
    <animateMotion path="M250,380 L250,235" dur="1.8s" repeatCount="indefinite" begin="1.7s"/>
    <animate attributeName="opacity" values="0;0.8;0.8;0" dur="1.8s" repeatCount="indefinite" begin="1.7s"/>
  </circle>

  <!-- Pulse: Center to Bottom-Left -->
  <circle r="4" fill="#00d4ff" filter="url(#pulseGlow)" opacity="0">
    <animateMotion path="M250,235 L144,338" dur="1.8s" repeatCount="indefinite" begin="1.0s"/>
    <animate attributeName="opacity" values="0;0.9;0.9;0" dur="1.8s" repeatCount="indefinite" begin="1.0s"/>
  </circle>
  <circle r="3" fill="#ff6b35" filter="url(#pulseGlow)" opacity="0">
    <animateMotion path="M144,338 L250,235" dur="1.8s" repeatCount="indefinite" begin="1.9s"/>
    <animate attributeName="opacity" values="0;0.8;0.8;0" dur="1.8s" repeatCount="indefinite" begin="1.9s"/>
  </circle>

  <!-- Pulse: Center to Left -->
  <circle r="4" fill="#00d4ff" filter="url(#pulseGlow)" opacity="0">
    <animateMotion path="M250,235 L105,235" dur="1.8s" repeatCount="indefinite" begin="1.2s"/>
    <animate attributeName="opacity" values="0;0.9;0.9;0" dur="1.8s" repeatCount="indefinite" begin="1.2s"/>
  </circle>
  <circle r="3" fill="#ff6b35" filter="url(#pulseGlow)" opacity="0">
    <animateMotion path="M105,235 L250,235" dur="1.8s" repeatCount="indefinite" begin="2.1s"/>
    <animate attributeName="opacity" values="0;0.8;0.8;0" dur="1.8s" repeatCount="indefinite" begin="2.1s"/>
  </circle>

  <!-- Pulse: Center to Top-Left -->
  <circle r="4" fill="#00d4ff" filter="url(#pulseGlow)" opacity="0">
    <animateMotion path="M250,235 L144,132" dur="1.8s" repeatCount="indefinite" begin="1.4s"/>
    <animate attributeName="opacity" values="0;0.9;0.9;0" dur="1.8s" repeatCount="indefinite" begin="1.4s"/>
  </circle>
  <circle r="3" fill="#ff6b35" filter="url(#pulseGlow)" opacity="0">
    <animateMotion path="M144,132 L250,235" dur="1.8s" repeatCount="indefinite" begin="2.3s"/>
    <animate attributeName="opacity" values="0;0.8;0.8;0" dur="1.8s" repeatCount="indefinite" begin="2.3s"/>
  </circle>

  <!-- === SERVER NODES (8 around the ring) === -->

  <!-- Server: Top -->
  <g filter="url(#glow)">
    <rect x="225" y="68" width="50" height="38" rx="5" fill="#1a1a2e" stroke="#d4a017" stroke-width="1.5"/>
    <text x="250" y="83" text-anchor="middle" fill="#d4a017" font-family="monospace" font-size="7" font-weight="bold">RAIDA</text>
    <text x="250" y="98" text-anchor="middle" fill="#8888a0" font-family="monospace" font-size="7">01</text>
  </g>

  <!-- Server: Top-Right -->
  <g filter="url(#glow)">
    <rect x="331" y="110" width="50" height="38" rx="5" fill="#1a1a2e" stroke="#d4a017" stroke-width="1.5"/>
    <text x="356" y="125" text-anchor="middle" fill="#d4a017" font-family="monospace" font-size="7" font-weight="bold">RAIDA</text>
    <text x="356" y="140" text-anchor="middle" fill="#8888a0" font-family="monospace" font-size="7">02</text>
  </g>

  <!-- Server: Right -->
  <g filter="url(#glow)">
    <rect x="370" y="216" width="50" height="38" rx="5" fill="#1a1a2e" stroke="#d4a017" stroke-width="1.5"/>
    <text x="395" y="231" text-anchor="middle" fill="#d4a017" font-family="monospace" font-size="7" font-weight="bold">RAIDA</text>
    <text x="395" y="246" text-anchor="middle" fill="#8888a0" font-family="monospace" font-size="7">03</text>
  </g>

  <!-- Server: Bottom-Right -->
  <g filter="url(#glow)">
    <rect x="331" y="319" width="50" height="38" rx="5" fill="#1a1a2e" stroke="#d4a017" stroke-width="1.5"/>
    <text x="356" y="334" text-anchor="middle" fill="#d4a017" font-family="monospace" font-size="7" font-weight="bold">RAIDA</text>
    <text x="356" y="349" text-anchor="middle" fill="#8888a0" font-family="monospace" font-size="7">04</text>
  </g>

  <!-- Server: Bottom -->
  <g filter="url(#glow)">
    <rect x="225" y="362" width="50" height="38" rx="5" fill="#1a1a2e" stroke="#d4a017" stroke-width="1.5"/>
    <text x="250" y="377" text-anchor="middle" fill="#d4a017" font-family="monospace" font-size="7" font-weight="bold">RAIDA</text>
    <text x="250" y="392" text-anchor="middle" fill="#8888a0" font-family="monospace" font-size="7">05</text>
  </g>

  <!-- Server: Bottom-Left -->
  <g filter="url(#glow)">
    <rect x="119" y="319" width="50" height="38" rx="5" fill="#1a1a2e" stroke="#d4a017" stroke-width="1.5"/>
    <text x="144" y="334" text-anchor="middle" fill="#d4a017" font-family="monospace" font-size="7" font-weight="bold">RAIDA</text>
    <text x="144" y="349" text-anchor="middle" fill="#8888a0" font-family="monospace" font-size="7">06</text>
  </g>

  <!-- Server: Left -->
  <g filter="url(#glow)">
    <rect x="80" y="216" width="50" height="38" rx="5" fill="#1a1a2e" stroke="#d4a017" stroke-width="1.5"/>
    <text x="105" y="231" text-anchor="middle" fill="#d4a017" font-family="monospace" font-size="7" font-weight="bold">RAIDA</text>
    <text x="105" y="246" text-anchor="middle" fill="#8888a0" font-family="monospace" font-size="7">07</text>
  </g>

  <!-- Server: Top-Left -->
  <g filter="url(#glow)">
    <rect x="119" y="110" width="50" height="38" rx="5" fill="#1a1a2e" stroke="#d4a017" stroke-width="1.5"/>
    <text x="144" y="125" text-anchor="middle" fill="#d4a017" font-family="monospace" font-size="7" font-weight="bold">RAIDA</text>
    <text x="144" y="140" text-anchor="middle" fill="#8888a0" font-family="monospace" font-size="7">08</text>
  </g>

  <!-- === CENTER CLIENT === -->
  <g filter="url(#glow)">
    <!-- Client box -->
    <rect x="218" y="210" width="64" height="50" rx="6" fill="#12121a" stroke="#00d4ff" stroke-width="2"/>
    <!-- Monitor screen -->
    <rect x="228" y="217" width="44" height="28" rx="2" fill="#0a0a0f" stroke="#00d4ff" stroke-width="0.8" stroke-opacity="0.5"/>
    <!-- Screen content lines -->
    <line x1="233" y1="225" x2="260" y2="225" stroke="#00d4ff" stroke-width="1" stroke-opacity="0.6"/>
    <line x1="233" y1="231" x2="255" y2="231" stroke="#00d4ff" stroke-width="1" stroke-opacity="0.4"/>
    <line x1="233" y1="237" x2="263" y2="237" stroke="#00d4ff" stroke-width="1" stroke-opacity="0.3"/>
    <!-- Monitor stand -->
    <rect x="244" y="260" width="12" height="4" rx="1" fill="#8888a0"/>
    <text x="250" y="208" text-anchor="middle" fill="#00d4ff" font-family="monospace" font-size="8" font-weight="bold">CLIENT</text>
  </g>

  <!-- Breathing glow on center -->
  <circle cx="250" cy="235" r="45" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.15">
    <animate attributeName="r" values="45;55;45" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.15;0.05;0.15" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- RAIDA label at bottom -->
  <text x="250" y="475" text-anchor="middle" fill="#00d4ff" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="700" letter-spacing="8">RAIDA</text>
  <text x="250" y="495" text-anchor="middle" fill="#8888a0" font-family="'Inter', sans-serif" font-size="10" letter-spacing="2">REDUNDANT ARRAY OF INDEPENDENT DETECTION AGENTS</text>
</svg>