<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">

    <!-- .byte: solid burnt-orange tech placard. Chamfered plate, dark
         interior so the colored symbols drawn on top remain legible. -->
    <defs>
      <linearGradient id="byte-body" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#5A2200" />
        <stop offset="18%" stop-color="#4A1B00" />
        <stop offset="34%" stop-color="#2C1000" />
        <stop offset="50%" stop-color="#140700" />
        <stop offset="66%" stop-color="#2C1000" />
        <stop offset="82%" stop-color="#4A1B00" />
        <stop offset="100%" stop-color="#5A2200" />
      </linearGradient>
      <linearGradient id="byte-rim" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#C74C00" />
        <stop offset="46%" stop-color="#FF7119" />
        <stop offset="100%" stop-color="#A33E00" />
      </linearGradient>
    </defs>

    <!-- solid chamfered plate -->
    <path d="M31 10 H69 L76 17 V79 L69 86 H31 L24 79 V17 Z"
          fill="url(#byte-body)" stroke="url(#byte-rim)" stroke-width="3.2" />

    <!-- inner bevel line -->
    <path d="M32 12.5 H68 L73.5 18 V78 L68 83.5 H32 L26.5 78 V18 Z"
          stroke="#FF7119" stroke-width="0.8" opacity="0.45" />

    <!-- status strip: etched groove + tier LED -->
    <path d="M33 81 H59" stroke="#6b2a00" stroke-width="1.2" stroke-linecap="round" />
    <circle cx="65" cy="81" r="1.4" fill="#FF7119" />

</svg>
