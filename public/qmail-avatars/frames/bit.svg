<!--Main frame with background-->
    <rect 
		x="24" 
		y="10" 
		width="52" 
		height="76" 
		rx="16" 
		fill="url(#bit-alarm)" 
		stroke="#ff2a2a" 
		stroke-width="3.4"
	/>

    <!-- .bit is the lowest denomination and is used here as a DANGER signal:
         a bright alarm-red frame warns the receiver this email may be
         dangerous. The interior stays dark enough that the colored symbols
         drawn on top remain legible. -->
    <defs>
      <linearGradient id="bit-alarm" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#4a1010" />
        <stop offset="18%" stop-color="#3d0d0d" />
        <stop offset="34%" stop-color="#270808" />
        <stop offset="50%" stop-color="#140404" />
        <stop offset="66%" stop-color="#270808" />
        <stop offset="82%" stop-color="#3d0d0d" />
        <stop offset="100%" stop-color="#4a1010" />
      </linearGradient>
    </defs>


		
