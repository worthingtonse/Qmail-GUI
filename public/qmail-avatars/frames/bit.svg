<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">

    <!-- .bit is the lowest denomination and is used here as a DANGER signal:
         a bright alarm-red frame warns the receiver this email may be
         dangerous. The interior stays dark enough that the colored symbols
         drawn on top remain legible. -->
    <defs>
      <radialGradient id="bit-alarm" cx="50%" cy="42%" r="62%">
        <stop offset="0%" stop-color="#5a1414" />
        <stop offset="100%" stop-color="#3a0c0c" />
      </radialGradient>
    </defs>

    <rect x="24" y="10" width="52" height="76" rx="16" fill="url(#bit-alarm)" stroke="#ff2a2a" stroke-width="3.4" />
    <rect x="22" y="78" width="56" height="8" fill="#3a0c0c" />

    <rect x="18" y="82" width="64" height="8" rx="4" fill="#ff2a2a" />
    <rect x="24" y="80" width="52" height="4" rx="3" fill="#ff7a7a" />

    <!-- warning mark on the base bar -->
    <path d="M50 84.5 v2.4" stroke="#3a0c0c" stroke-width="1.6" stroke-linecap="round" />
    <circle cx="50" cy="89.2" r="0.9" fill="#3a0c0c" />

</svg>
