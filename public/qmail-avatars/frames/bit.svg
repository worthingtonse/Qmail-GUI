<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">

    <!-- .bit is the lowest denomination and is used as a DANGER signal: a
         solid alarm-red tech placard warns the receiver this email may be
         dangerous. Chamfered plate, dark interior so the colored symbols
         drawn on top remain legible. -->
    <defs>
      <linearGradient id="bit-body" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#4a1010" />
        <stop offset="18%" stop-color="#3d0d0d" />
        <stop offset="34%" stop-color="#270808" />
        <stop offset="50%" stop-color="#140404" />
        <stop offset="66%" stop-color="#270808" />
        <stop offset="82%" stop-color="#3d0d0d" />
        <stop offset="100%" stop-color="#4a1010" />
      </linearGradient>
    </defs>

    <!-- solid chamfered plate -->
    <path d="M31 10 H69 L76 17 V79 L69 86 H31 L24 79 V17 Z"
          fill="url(#bit-body)" stroke="#ff2a2a" stroke-width="3" />

    <!-- inner bevel line -->
    <path d="M32 12.5 H68 L73.5 18 V78 L68 83.5 H32 L26.5 78 V18 Z"
          stroke="#ff2a2a" stroke-width="0.8" opacity="0.45" />

    <!-- status strip: etched groove + tier LED -->
    <path d="M33 81 H59" stroke="#5c1414" stroke-width="1.2" stroke-linecap="round" />
    <circle cx="65" cy="81" r="1.4" fill="#ff2a2a" />

</svg>
