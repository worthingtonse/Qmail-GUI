<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">

    <!-- .epic sits above .giga: an amethyst-and-royal-purple placard with a
         jeweled read. Same chamfered plate geometry as the other frames
         (plate x=24..76, y=10..86) so the symbol window stays identical.
         Triple inner bevel + twin gems outrank giga's double bevel; the
         body stays dark so the colored symbols on top remain legible. -->
    <defs>
      <linearGradient id="epic-rim" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%"   stop-color="#4a1670" />
        <stop offset="22%"  stop-color="#b45af6" />
        <stop offset="45%"  stop-color="#f3d4ff" />
        <stop offset="60%"  stop-color="#9633e9" />
        <stop offset="82%"  stop-color="#3d0f5e" />
        <stop offset="100%" stop-color="#8f2be1" />
      </linearGradient>
      <linearGradient id="epic-body" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#4c2875" />
        <stop offset="18%" stop-color="#3d2061" />
        <stop offset="34%" stop-color="#241239" />
        <stop offset="50%" stop-color="#0c0514" />
        <stop offset="66%" stop-color="#241239" />
        <stop offset="82%" stop-color="#3d2061" />
        <stop offset="100%" stop-color="#4c2875" />
      </linearGradient>
    </defs>

    <!-- solid chamfered plate -->
    <path d="M31 10 H69 L76 17 V79 L69 86 H31 L24 79 V17 Z"
          fill="url(#epic-body)" stroke="url(#epic-rim)" stroke-width="4" />

    <!-- triple inner bevel: above-giga tier marker -->
    <path d="M32 12.5 H68 L73.5 18 V78 L68 83.5 H32 L26.5 78 V18 Z"
          stroke="#f0dbff" stroke-width="0.9" opacity="0.65" />
    <path d="M33.2 14 H66.8 L72 19.2 V76.8 L66.8 82 H33.2 L28 76.8 V19.2 Z"
          stroke="#f0dbff" stroke-width="0.6" opacity="0.4" />
    <path d="M34.4 15.5 H65.6 L70.5 20.4 V75.6 L65.6 80.5 H34.4 L29.5 75.6 V20.4 Z"
          stroke="#f0dbff" stroke-width="0.45" opacity="0.25" />

    <!-- status strip: etched groove + twin gem LEDs -->
    <path d="M33 81 H56" stroke="#2c1245" stroke-width="1.2" stroke-linecap="round" />
    <circle cx="61.5" cy="81" r="1.4" fill="#f3d4ff" />
    <circle cx="66" cy="81" r="1.4" fill="#c07df8" />

</svg>
