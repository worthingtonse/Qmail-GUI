<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">

    <!-- .giga is the top denomination: a solid gold tech placard. The
         diagonal gold gradient on the edge (dark bronze -> bright highlight
         -> deep bronze) keeps the polished-metal read, and a second inner
         bevel marks the top tier in place of the old crown. The chamfered
         plate body stays dark so the colored symbols drawn on top remain
         legible. -->
    <defs>
      <linearGradient id="giga-rim" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%"   stop-color="#a86a16" />
        <stop offset="22%"  stop-color="#f6d35a" />
        <stop offset="45%"  stop-color="#fff6c4" />
        <stop offset="60%"  stop-color="#e9b733" />
        <stop offset="82%"  stop-color="#9c5e12" />
        <stop offset="100%" stop-color="#e1aa2b" />
      </linearGradient>
      <linearGradient id="giga-body" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#756d28" />
        <stop offset="18%" stop-color="#625b21" />
        <stop offset="34%" stop-color="#3d3814" />
        <stop offset="50%" stop-color="#120f05" />
        <stop offset="66%" stop-color="#3d3814" />
        <stop offset="82%" stop-color="#625b21" />
        <stop offset="100%" stop-color="#756d28" />
      </linearGradient>
    </defs>

    <!-- solid chamfered plate -->
    <path d="M31 10 H69 L76 17 V79 L69 86 H31 L24 79 V17 Z"
          fill="url(#giga-body)" stroke="url(#giga-rim)" stroke-width="4" />

    <!-- double inner bevel: top-tier marker -->
    <path d="M32 12.5 H68 L73.5 18 V78 L68 83.5 H32 L26.5 78 V18 Z"
          stroke="#fff4cf" stroke-width="0.9" opacity="0.6" />
    <path d="M33.2 14 H66.8 L72 19.2 V76.8 L66.8 82 H33.2 L28 76.8 V19.2 Z"
          stroke="#fff4cf" stroke-width="0.6" opacity="0.35" />

    <!-- status strip: etched groove + tier LED -->
    <path d="M33 81 H59" stroke="#4a3c10" stroke-width="1.2" stroke-linecap="round" />
    <circle cx="65" cy="81" r="1.4" fill="#fff6c4" />

</svg>
