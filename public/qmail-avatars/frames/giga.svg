<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">

    <!-- .giga is the top denomination: a "real gold" frame. Gold isn't a
         single color — it reads as metal because of how light plays across
         it. We fake that with gradients running dark-bronze -> bright
         highlight -> deep-bronze, plus a thin specular sheen on the rim. -->
    <defs>
      <!-- Rim/border metal: diagonal so one edge catches the light. -->
      <linearGradient id="giga-rim" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%"   stop-color="#a86a16" />
        <stop offset="22%"  stop-color="#f6d35a" />
        <stop offset="45%"  stop-color="#fff6c4" />
        <stop offset="60%"  stop-color="#e9b733" />
        <stop offset="82%"  stop-color="#9c5e12" />
        <stop offset="100%" stop-color="#e1aa2b" />
      </linearGradient>
      <!-- Base bar metal: vertical, brightest near the top edge. -->
      <linearGradient id="giga-bar" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%"   stop-color="#fff3b0" />
        <stop offset="40%"  stop-color="#f2c64b" />
        <stop offset="100%" stop-color="#9c5e12" />
      </linearGradient>
      <!-- Crown / chevron metal. -->
      <linearGradient id="giga-crown" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%"   stop-color="#fff6c4" />
        <stop offset="100%" stop-color="#d39a23" />
      </linearGradient>
    </defs>

    <path d="M39 10 L50 3 L61 10" fill="url(#giga-crown)" />
    <path d="M39 10 H61" stroke="#fff8df" stroke-width="1.8" stroke-linecap="round" />

    <rect x="24" y="10" width="52" height="76" rx="16" fill="#23364b" stroke="url(#giga-rim)" stroke-width="4.2" />
    <!-- specular sheen: a brighter thin arc on the upper-left of the rim -->
    <path d="M30 16 C26 22, 26 40, 26 50" fill="none" stroke="#fff8df" stroke-width="1.1" stroke-linecap="round" opacity="0.85" />
    <rect x="22" y="78" width="56" height="8" fill="#23364b" />
    <!-- inner highlight line: flush against the rim's inner edge, no gap -->
    <rect x="26.2" y="12.2" width="47.6" height="71.6" rx="14" fill="none" stroke="#fff4cf" stroke-width="1.2" />

      <path d="M31 13 C39 9.5, 61 9.5, 69 13" fill="none" stroke="#fff4cf" stroke-width="1.6" stroke-linecap="round" />
      <path d="M31 83 C39 86.5, 61 86.5, 69 83" fill="none" stroke="#fff4cf" stroke-width="1.6" stroke-linecap="round" />

    <rect x="15.6" y="80.4" width="68.8" height="9.4" rx="4" fill="url(#giga-bar)" />
    <rect x="24" y="78.4" width="52" height="5.2" rx="3" fill="#fff8df" />

      <path d="M19 88 L10 93 L19 96" fill="url(#giga-crown)" />
      <path d="M81 88 L90 93 L81 96" fill="url(#giga-crown)" />
      <path d="M29 87 H71" stroke="#7a4a0e" stroke-width="1.6" stroke-linecap="round" />
      <path d="M30 91 H70" stroke="#fff8df" stroke-width="1.1" stroke-linecap="round" />

</svg>
