<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">

    <!-- .kilo: solid copper tech placard. The diagonal copper gradient on
         the edge (dark copper -> rose-gold highlight -> deep brown) keeps
         the polished-metal read; the chamfered plate body stays dark so the
         colored symbols drawn on top remain legible. -->
    <defs>
      <linearGradient id="kilo-rim" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%"   stop-color="#7a3b1d" />
        <stop offset="24%"  stop-color="#d57b48" />
        <stop offset="46%"  stop-color="#ffd2ab" />
        <stop offset="62%"  stop-color="#c96a36" />
        <stop offset="84%"  stop-color="#6e3417" />
        <stop offset="100%" stop-color="#b1612f" />
      </linearGradient>
      <linearGradient id="kilo-body" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#1c2d3f" />
        <stop offset="18%" stop-color="#172737" />
        <stop offset="34%" stop-color="#0e1b29" />
        <stop offset="50%" stop-color="#050d17" />
        <stop offset="66%" stop-color="#0e1b29" />
        <stop offset="82%" stop-color="#172737" />
        <stop offset="100%" stop-color="#1c2d3f" />
      </linearGradient>
    </defs>

    <!-- solid chamfered plate -->
    <path d="M31 10 H69 L76 17 V79 L69 86 H31 L24 79 V17 Z"
          fill="url(#kilo-body)" stroke="url(#kilo-rim)" stroke-width="3.4" />

    <!-- inner bevel line -->
    <path d="M32 12.5 H68 L73.5 18 V78 L68 83.5 H32 L26.5 78 V18 Z"
          stroke="#f3c9a8" stroke-width="0.8" opacity="0.5" />

    <!-- status strip: etched groove + tier LED -->
    <path d="M33 81 H59" stroke="#3a2618" stroke-width="1.2" stroke-linecap="round" />
    <circle cx="65" cy="81" r="1.4" fill="#ffd2ab" />

</svg>
