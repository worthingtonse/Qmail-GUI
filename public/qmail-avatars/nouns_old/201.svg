  <rect x="27" y="90" width="6" height="3" fill="#2a1a0f" />
  <rect x="41" y="90" width="6" height="3" fill="#2a1a0f" />
  <rect x="55" y="90" width="6" height="3" fill="#2a1a0f" />
  <rect x="69" y="90" width="6" height="3" fill="#2a1a0f" />
