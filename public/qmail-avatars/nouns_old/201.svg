    stroke="#8b6f47"
    stroke-width="3"
    stroke-linecap="round"
  />
  <!-- Eye -->
  <circle cx="50" cy="30" r="1.2" fill="#1b120d" />
  <!-- Nostrils -->
  <circle cx="49" cy="42" r="0.8" fill="#3d2817" />
  <circle cx="55" cy="42" r="0.8" fill="#3d2817" />
  <!-- Front left leg -->
  <rect x="28" y="70" width="4" height="20" fill="#4a2f18" />
  <!-- Front right leg -->
  <rect x="42" y="70" width="4" height="20" fill="#4a2f18" />
  <!-- Back left leg -->
  <rect x="56" y="72" width="4" height="18" fill="#3d2817" />
  <!-- Back right leg -->
  <rect x="70" y="72" width="4" height="18" fill="#3d2817" />
